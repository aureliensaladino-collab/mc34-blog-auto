
name: Actualites automatiques MC34

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualites:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Recuperer les actualites
        run: python actualites.py

      - name: Enregistrer les actualites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour automatique des actualites"
            git push
          fi
